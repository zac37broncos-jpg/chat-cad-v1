  <!-- nozzle -->
  <path d="M104 30h48v26l-14 20h-20l-14-20z" fill="#2b2b2b"/>
  <rect x="122" y="76" width="12" height="10" fill="#2b2b2b"/>
  <!-- printed dome, built from layers -->
  <g fill="#fff4e6">
    <rect x="96" y="104" width="64" height="16" rx="8"/>
    <rect x="72" y="126" width="112" height="16" rx="8"/>
    <rect x="58" y="148" width="140" height="16" rx="8"/>
    <rect x="50" y="170" width="156" height="16" rx="8"/>
    <rect x="46" y="192" width="164" height="16" rx="8"/>
  </g>
  <!-- build plate -->
  <rect x="34" y="214" width="188" height="10" rx="5" fill="#2b2b2b"/>
